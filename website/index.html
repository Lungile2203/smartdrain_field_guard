<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Drainage Guard</title>
<style>
  :root { --bg: #f3f8f8; --panel: #ffffff; --ink: #0b2530; --muted: #4c5e66; --accent: #0e7c72; --line: #d5e3e3; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0b2530; --panel: #123441; --ink: #eef6f6; --muted: #bfd8d5; --accent: #3cc4b4; --line: #24495a; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  main { width: 100%; max-width: 460px; }
  h1 { font-size: 28px; margin: 0 0 6px; }
  p { color: var(--muted); margin: 0 0 24px; }
  a.btn { display: block; text-decoration: none; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 12px; color: var(--ink); }
  a.btn b { display: block; font-size: 18px; }
  a.btn span { color: var(--muted); font-size: 14px; }
  a.btn.main { background: var(--accent); border-color: var(--accent); color: #fff; }
  a.btn.main span { color: #e6f6f4; }
</style>
</head>
<body>
<main>
  <h1>Smart Drainage Guard</h1>
  <p>See the risk. Act before the flood.</p>
  <a class="btn main" href="community.html"><b>Report a blocked drain</b><span>For residents · no sign-up needed</span></a>
  <a class="btn" href="dashboard.html"><b>Workers’ dashboard</b><span>For municipal workers · sign-in required</span></a>
</main>
</body>
</html>
