<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6e99">
<title>Drainage Guard Field</title>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
  :root {
    --bg: #f4f6f8; --panel: #fff; --ink: #14202b; --muted: #5b6b79; --line: #dfe5ea; --accent: #0b6e99;
    --ok: #12805c; --ok-bg: #e3f4ec; --warn: #b26a00; --warn-bg: #fff1d9; --crit: #c0262d; --crit-bg: #fde4e4;
    --block: #6b3fb5; --block-bg: #efe7fb; --off: #6b7785; --off-bg: #eceff2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e151b; --panel: #16212a; --ink: #e6edf2; --muted: #93a4b2; --line: #26343f; --accent: #5cc1ee;
      --ok: #3ccf95; --ok-bg: #133328; --warn: #f2b14c; --warn-bg: #3a2c12; --crit: #ff6b6f; --crit-bg: #3d1a1c;
      --block: #b89af0; --block-bg: #2a2140; --off: #8c99a6; --off-bg: #222d36;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
  header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
           padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  header b { font-size: 16px; } header small { display: block; font-size: 12px; color: var(--muted); }
  .pill { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: var(--off-bg); color: var(--off); white-space: nowrap; }
  .pill.on { background: var(--ok-bg); color: var(--ok); }
  main { padding: 16px; max-width: 640px; margin: 0 auto; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  label.f { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 14px 0 6px; }
  input, textarea, select { width: 100%; font: inherit; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  textarea { min-height: 70px; resize: vertical; }
  .types { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .types button { padding: 14px 8px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); color: var(--ink);
                  font: inherit; font-weight: 600; font-size: 14px; cursor: pointer; }
  .types button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--panel)); }
  .types button span { display: block; font-size: 22px; margin-bottom: 2px; }
  .btn { display: block; width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel);
         color: var(--ink); font: inherit; font-weight: 700; cursor: pointer; text-align: center; text-decoration: none; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.sm { display: inline-block; width: auto; padding: 8px 12px; font-size: 13px; border-radius: 9px; }
  .loc { display: flex; gap: 10px; align-items: center; font-size: 14px; }
  .loc .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--off); flex: none; }
  .loc.ok .dot { background: var(--ok); }
  .photo { display: none; width: 100%; max-height: 220px; object-fit: cover; border-radius: 10px; margin-top: 10px; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; display: grid; grid-template-columns: 1fr 1fr 1fr; background: var(--panel);
        border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
  nav button { background: none; border: 0; padding: 10px 0 12px; font: inherit; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; position: relative; }
  nav button span { display: block; font-size: 20px; }
  nav button.active { color: var(--accent); }
  nav .count { position: absolute; top: 6px; left: 55%; background: var(--crit); color: #fff; font-size: 11px; border-radius: 99px; padding: 0 6px; display: none; }
  .tab { display: none; } .tab.active { display: block; }
  .filters { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; }
  .filters button { flex: none; padding: 7px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; font-size: 13px; font-weight: 600; }
  .filters button.active { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .job { display: grid; grid-template-columns: 72px 1fr; gap: 12px; }
  .job img, .job .noimg { width: 72px; height: 72px; border-radius: 10px; object-fit: cover; background: var(--off-bg); display: grid; place-items: center; font-size: 26px; }
  .job h3 { margin: 0; font-size: 15px; }
  .job .sub { font-size: 12px; color: var(--muted); }
  .job p { margin: 6px 0 0; font-size: 14px; }
  .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; grid-column: 1 / -1; }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: .4px; margin-right: 4px; }
  .t-blocked { background: var(--block-bg); color: var(--block); } .t-overflowing { background: var(--crit-bg); color: var(--crit); }
  .t-damaged { background: var(--warn-bg); color: var(--warn); } .t-other { background: var(--off-bg); color: var(--off); }
  .s-reported { background: var(--crit-bg); color: var(--crit); } .s-progress { background: var(--warn-bg); color: var(--warn); }
  .s-cleared { background: var(--ok-bg); color: var(--ok); }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }
  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 10px 16px;
           border-radius: 10px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 10; max-width: 90vw; }
  .toast.show { opacity: 1; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<header>
  <div><b>Drainage Guard · Field</b><small id="who">Field worker</small></div>
  <span id="conn" class="pill">Offline</span>
</header>

<main>
  <!-- REPORT -->
  <section class="tab active" id="tab-report">
    <div class="card">
      <h2>1. What's wrong?</h2>
      <div class="types" id="types">
        <button type="button" data-type="blocked" aria-pressed="false"><span>🚧</span>Blocked</button>
        <button type="button" data-type="overflowing" aria-pressed="false"><span>🌊</span>Overflowing</button>
        <button type="button" data-type="damaged" aria-pressed="false"><span>🔧</span>Damaged / open</button>
        <button type="button" data-type="other" aria-pressed="false"><span>❓</span>Other</button>
      </div>
    </div>
    <div class="card">
      <h2>2. Where?</h2>
      <div class="loc" id="loc"><span class="dot"></span><span id="locText">Getting GPS location…</span></div>
      <button class="btn sm" style="margin-top:10px" onclick="getLocation()">Refresh location</button>
      <label class="f" for="landmark">Street or landmark</label>
      <input id="landmark" placeholder="e.g. Corner of Zastron St & Kellner St">
    </div>
    <div class="card">
      <h2>3. Photo and details</h2>
      <label class="btn" for="photoIn">📷 Take photo</label>
      <input id="photoIn" type="file" accept="image/*" capture="environment" style="display:none">
      <img id="photoPrev" class="photo" alt="Photo of the drain">
      <label class="f" for="severity">How urgent?</label>
      <select id="severity">
        <option value="low">Low: can wait for routine cleaning</option>
        <option value="medium" selected>Medium: clear within 24 hours</option>
        <option value="high">High: flooding road or property now</option>
      </select>
      <label class="f" for="note">Notes</label>
      <textarea id="note" placeholder="e.g. Plastic and sand filling the grate, water standing 10 cm"></textarea>
    </div>
    <button class="btn primary" id="sendBtn" onclick="submitReport()">Send report to team</button>
    <div class="hint" id="queueHint"></div>
  </section>

  <!-- JOBS -->
  <section class="tab" id="tab-jobs">
    <div class="filters" id="filters">
      <button data-f="open" class="active">Open</button>
      <button data-f="mine">Mine</button>
      <button data-f="cleared">Cleared</button>
      <button data-f="all">All</button>
    </div>
    <div id="jobs"><div class="empty">No reports yet.</div></div>
  </section>

  <!-- SETTINGS -->
  <section class="tab" id="tab-settings">
    <div class="card">
      <h2>Your details</h2>
      <label class="f" for="sName">Name</label><input id="sName" placeholder="e.g. T. Mokoena">
      <label class="f" for="sTeam">Team / depot</label><input id="sTeam" placeholder="e.g. Stormwater Team B">
    </div>
    <div class="card">
      <h2>Server connection</h2>
      <label class="f" for="sHost">Broker URL</label><input id="sHost" placeholder="xxxx.s1.eu.hivemq.cloud" autocapitalize="off">
      <label class="f" for="sUser">Username</label><input id="sUser" autocapitalize="off" autocomplete="username">
      <label class="f" for="sPass">Password</label><input id="sPass" type="password" autocomplete="current-password">
      <div class="hint">EMQX: port 8084 · path /mqtt · topic sdg/report/#</div>
    </div>
    <button class="btn primary" onclick="saveSettings()">Save and connect</button>
    <button class="btn" style="margin-top:10px" onclick="enableAlerts()">Turn on new-report alerts</button>
  </section>
</main>

<nav>
  <button class="active" data-tab="report"><span>➕</span>Report</button>
  <button data-tab="jobs"><span>📋</span>Jobs<i class="count" id="count"></i></button>
  <button data-tab="settings"><span>⚙️</span>Settings</button>
</nav>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
const TYPES = { blocked: "Blocked", overflowing: "Overflowing", damaged: "Damaged / open", other: "Other" };
const STATUS = { reported: ["Reported", "s-reported"], progress: ["On my way", "s-progress"], cleared: ["Cleared", "s-cleared"] };
const reports = {};            // id -> report
let client = null, pos = null, photo = null, type = null, filter = "open", alertsOn = false;
let queue = JSON.parse(store.get("sdg_queue", "[]"));

// ---------- config: settings form, or a shared link like worker.html#host=...&user=...&pass=... ----------
(function loadConfig() {
  const h = new URLSearchParams(location.hash.slice(1));
  ["host", "user", "pass"].forEach(k => { if (h.get(k)) store.set("sdg_w_" + k, h.get(k)); });
  if (location.hash) history.replaceState(null, "", location.pathname);   // keep the password out of the address bar
  $("sHost").value = store.get("sdg_w_host", ""); $("sUser").value = store.get("sdg_w_user", "");
  $("sPass").value = store.get("sdg_w_pass", "");
  $("sName").value = store.get("sdg_w_name", ""); $("sTeam").value = store.get("sdg_w_team", "");
  updateWho();
})();
function updateWho() { const n = store.get("sdg_w_name", ""), t = store.get("sdg_w_team", ""); $("who").textContent = n ? n + (t ? " · " + t : "") : "Set your name in Settings"; }
function me() { return store.get("sdg_w_name", "") || "Unnamed worker"; }

function saveSettings() {
  store.set("sdg_w_name", $("sName").value.trim()); store.set("sdg_w_team", $("sTeam").value.trim());
  store.set("sdg_w_host", $("sHost").value.trim()); store.set("sdg_w_user", $("sUser").value.trim());
  store.set("sdg_w_pass", $("sPass").value);
  updateWho(); connect(); toast("Saved");
}

// ---------- MQTT ----------
function connect() {
  const host = store.get("sdg_w_host", "");
  if (!host) { setConn("Not set up", ""); return; }
  if (client) client.end(true);
  const local = host === "localhost" || host === "127.0.0.1";
  const url = local ? `ws://${host}:9001/` : `wss://${host}:${host.includes('emqxsl') ? 8084 : 8884}/mqtt`;
  setConn("Connecting…", "");
  client = mqtt.connect(url, {
    username: store.get("sdg_w_user", "") || undefined, password: store.get("sdg_w_pass", "") || undefined,
    clientId: "sdg-field-" + Math.random().toString(16).slice(2, 8), reconnectPeriod: 4000, connectTimeout: 10000
  });
  client.on("connect", () => { setConn("Online", "on"); client.subscribe("sdg/report/#", { qos: 1 }); flushQueue(); });
  client.on("reconnect", () => setConn("Reconnecting…", ""));
  client.on("offline", () => setConn("Offline", ""));
  client.on("error", e => setConn("Error", ""));
  client.on("message", (topic, buf) => {
    let r; try { r = JSON.parse(buf.toString()); } catch { return; }
    if (!r || !r.id) return;
    const isNew = !reports[r.id];
    reports[r.id] = r;
    if (isNew && r.reporter !== me() && Date.now() - r.ts < 5 * 60 * 1000) newReportAlert(r);
    renderJobs();
  });
}
function setConn(t, c) { const p = $("conn"); p.textContent = t; p.className = "pill " + c; }
function publish(r) {
  // retained: the broker keeps the latest copy of every report, so workers who open the app later still see it
  client.publish("sdg/report/" + r.id, JSON.stringify(r), { qos: 1, retain: true });
}

// ---------- location ----------
function getLocation() {
  if (!navigator.geolocation) { $("locText").textContent = "This phone can't share location. Type the street below."; return; }
  $("locText").textContent = "Getting GPS location…"; $("loc").className = "loc";
  navigator.geolocation.getCurrentPosition(p => {
    pos = { lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6), acc: Math.round(p.coords.accuracy) };
    $("loc").className = "loc ok";
    $("locText").innerHTML = `${pos.lat}, ${pos.lng} <span style="color:var(--muted)">(±${pos.acc} m)</span>`;
  }, err => {
    $("locText").textContent = err.code === 1 ? "Location blocked. Allow location for this site, or type the street below."
                                              : "Couldn't get GPS. Move outside, or type the street below.";
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
}

// ---------- photo: shrink to ~60 KB so it travels fast on weak signal ----------
$("photoIn").addEventListener("change", e => {
  const file = e.target.files[0]; if (!file) return;
  const img = new Image();
  img.onload = () => {
    const max = 640, s = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    photo = c.toDataURL("image/jpeg", 0.6);
    $("photoPrev").src = photo; $("photoPrev").style.display = "block";
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(file);
});

$("types").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  type = b.dataset.type;
  document.querySelectorAll("#types button").forEach(x => x.setAttribute("aria-pressed", x === b));
});

// ---------- submit ----------
function submitReport() {
  if (!type) return toast("Choose what's wrong first");
  if (!pos && !$("landmark").value.trim()) return toast("Add a location: GPS or a street name");
  const r = {
    id: "R" + Date.now().toString(36).toUpperCase().slice(-6) + Math.random().toString(36).slice(2, 4).toUpperCase(),
    type, severity: $("severity").value, lat: pos?.lat ?? null, lng: pos?.lng ?? null, acc: pos?.acc ?? null,
    landmark: $("landmark").value.trim(), note: $("note").value.trim(), photo,
    reporter: me(), team: store.get("sdg_w_team", ""), ts: Date.now(),
    status: "reported", history: [{ status: "reported", by: me(), ts: Date.now() }]
  };
  reports[r.id] = r;
  if (client && client.connected) { publish(r); toast("Report sent to the team ✓"); }
  else { queue.push(r); store.set("sdg_queue", JSON.stringify(queue)); toast("No signal: saved, will send automatically"); }
  updateQueueHint();
  // reset form
  type = null; photo = null; document.querySelectorAll("#types button").forEach(x => x.setAttribute("aria-pressed", "false"));
  $("note").value = ""; $("landmark").value = ""; $("photoPrev").style.display = "none"; $("photoIn").value = "";
  renderJobs(); showTab("jobs");
}
function flushQueue() {
  if (!queue.length) return;
  queue.forEach(publish); toast(`Sent ${queue.length} saved report(s)`);
  queue = []; store.set("sdg_queue", "[]"); updateQueueHint();
}
function updateQueueHint() { $("queueHint").textContent = queue.length ? `${queue.length} report(s) waiting for signal` : ""; }

function setStatus(id, status) {
  const r = reports[id]; if (!r) return;
  if (!client || !client.connected) return toast("You're offline. Try again when connected.");
  r.status = status; r.history = (r.history || []).concat({ status, by: me(), ts: Date.now() });
  if (status === "progress") r.assignee = me();
  publish(r); renderJobs(); toast(status === "cleared" ? "Marked cleared ✓" : "Team told you're on your way");
}

function shareWhatsApp(id) {
  const r = reports[id];
  const where = r.lat != null ? `https://maps.google.com/?q=${r.lat},${r.lng}` : "";
  const msg = `🚨 Drain report ${r.id}\n${TYPES[r.type]} · ${r.severity.toUpperCase()} urgency\n📍 ${r.landmark || "See map"}\n${where}\n${r.note ? "📝 " + r.note + "\n" : ""}Reported by ${r.reporter} · ${new Date(r.ts).toLocaleString()}`;
  window.open("https://wa.me/?text=" + encodeURIComponent(msg), "_blank");
}

// ---------- jobs list ----------
function distanceKm(r) {
  if (!pos || r.lat == null) return null;
  const R = 6371, dLat = (r.lat - pos.lat) * Math.PI / 180, dLng = (r.lng - pos.lng) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(pos.lat * Math.PI / 180) * Math.cos(r.lat * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
function ago(ts) { const m = Math.round((Date.now() - ts) / 60000); return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " d ago"; }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

function renderJobs() {
  const all = Object.values(reports);
  const open = all.filter(r => r.status !== "cleared");
  const c = $("count"); c.textContent = open.length; c.style.display = open.length ? "block" : "none";
  let list = filter === "open" ? open : filter === "cleared" ? all.filter(r => r.status === "cleared")
           : filter === "mine" ? all.filter(r => r.reporter === me() || r.assignee === me()) : all;
  const sevRank = { high: 0, medium: 1, low: 2 };
  list.sort((a, b) => (a.status === "cleared") - (b.status === "cleared") || sevRank[a.severity] - sevRank[b.severity] || b.ts - a.ts);
  if (!list.length) { $("jobs").innerHTML = `<div class="empty">Nothing here.</div>`; return; }
  $("jobs").innerHTML = list.map(r => {
    const d = distanceKm(r), [sLabel, sCls] = STATUS[r.status] || STATUS.reported;
    const map = r.lat != null ? `<a class="btn sm" href="https://www.google.com/maps/dir/?api=1&destination=${r.lat},${r.lng}" target="_blank" rel="noopener">🧭 Directions</a>` : "";
    const acts = r.status === "reported" ? `<button class="btn sm" onclick="setStatus('${r.id}','progress')">🚶 On my way</button>` : "";
    const clear = r.status !== "cleared" ? `<button class="btn sm" onclick="setStatus('${r.id}','cleared')">✅ Cleared</button>` : "";
    return `<div class="card job">
      ${r.photo ? `<img src="${r.photo}" alt="Drain photo">` : `<div class="noimg">🕳️</div>`}
      <div>
        <div><span class="badge t-${esc(r.type)}">${esc(TYPES[r.type] || r.type)}</span><span class="badge ${sCls}">${sLabel}</span></div>
        <h3 style="margin-top:4px">${esc(r.landmark || (r.lat != null ? r.lat + ", " + r.lng : "No location"))}</h3>
        <div class="sub">${esc(r.id)} · ${esc(r.severity)} urgency · ${ago(r.ts)}${d != null ? " · " + d.toFixed(1) + " km away" : ""}</div>
        <div class="sub">By ${esc(r.reporter)}${r.assignee && r.status === "progress" ? " · " + esc(r.assignee) + " on the way" : ""}</div>
        ${r.note ? `<p>${esc(r.note)}</p>` : ""}
      </div>
      <div class="acts">${map}${acts}${clear}<button class="btn sm" onclick="shareWhatsApp('${r.id}')">💬 WhatsApp group</button></div>
    </div>`;
  }).join("");
}

$("filters").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  filter = b.dataset.f; document.querySelectorAll("#filters button").forEach(x => x.classList.toggle("active", x === b)); renderJobs();
});

// ---------- new-report alert: sound + vibration + notification ----------
function enableAlerts() {
  alertsOn = true; beep(); toast("Alerts on for this session");
  if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
}
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, .25].forEach(t => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.2, ctx.currentTime + t); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + .15); });
  } catch {}
}
function newReportAlert(r) {
  toast(`New: ${TYPES[r.type]} at ${r.landmark || "GPS location"}`);
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  if (alertsOn) beep();
  try { if ("Notification" in window && Notification.permission === "granted" && document.hidden)
    new Notification("New drain report", { body: `${TYPES[r.type]} · ${r.landmark || "See map"} · by ${r.reporter}` }); } catch {}
}

// ---------- tabs + toast ----------
function showTab(name) {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.id === "tab-" + name));
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
  if (name === "jobs") renderJobs();
}
document.querySelector("nav").addEventListener("click", e => { const b = e.target.closest("button"); if (b) showTab(b.dataset.tab); });
let toastT; function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600); }

getLocation(); updateQueueHint(); connect();
if (!store.get("sdg_w_host", "")) showTab("settings");
setInterval(renderJobs, 60000);
</script>
</body>
